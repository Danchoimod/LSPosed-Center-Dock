plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dextaskbarcenter'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dextaskbarcenter"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
